<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shirley 英语口语 · 课堂复习站</title>
<style>
  :root{
    --bg:#faf8f5; --card:#ffffff; --ink:#23272f; --sub:#8a857e;
    --accent:#b3542e; --accent-soft:#f9ece5; --ok:#3f7d5a; --warn:#b57e2a;
    --line:#ece7df; --dark:#211d19; --dark2:#2e2924;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
  .layout{display:flex;min-height:100vh}
  /* ---------- sidebar ---------- */
  .sidebar{width:272px;background:var(--dark);color:#d8d2ca;padding:26px 16px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;flex-shrink:0}
  .brand{font-size:19px;color:#fff;margin-bottom:4px}
  .brand span{color:var(--accent)}
  .tagline{font-size:12px;color:#948c81;margin-bottom:22px}
  .nav-title{font-size:11px;letter-spacing:2px;color:#7d766b;margin:18px 0 8px}
  .lesson-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c4bcb1;cursor:pointer;text-decoration:none;margin-bottom:4px;transition:.15s}
  .lesson-link:hover{background:var(--dark2);color:#fff}
  .lesson-link.active{background:var(--accent);color:#fff}
  .lesson-num{width:24px;height:24px;border-radius:7px;background:var(--dark2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .lesson-link.active .lesson-num{background:rgba(255,255,255,.22)}
  .lesson-name{font-size:13.5px}
  .lesson-date{font-size:11px;color:#7d766b;margin-left:auto}
  .lesson-link.active .lesson-date{color:rgba(255,255,255,.8)}
  /* ---------- main ---------- */
  .main{margin-left:272px;flex:1;padding:40px 46px;max-width:940px}
  /* home */
  .hero{padding:34px 0 10px}
  .hero .book{font-size:40px}
  .hero h1{font-size:30px;margin:8px 0 10px}
  .hero p{color:var(--sub);max-width:560px}
  .stats{display:flex;gap:16px;margin:28px 0 34px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 26px;min-width:140px}
  .stat b{font-size:26px;color:var(--accent)}
  .stat div{font-size:12.5px;color:var(--sub);margin-top:2px}
  /* lesson head */
  .lesson-kicker{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--accent)}
  h2.page-title{font-size:26px;margin:6px 0 12px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13.5px;color:var(--sub)}
  .meta span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px}
  .summary{color:var(--sub);font-size:14px;margin:6px 0 26px}
  /* sections */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;margin-bottom:18px;box-shadow:0 1px 3px rgba(35,39,47,.04)}
  .card h3{font-size:17.5px;margin-bottom:16px}
  /* dialogue lines */
  .line{margin-bottom:12px}
  .line .en{font-size:15.5px;font-weight:600}
  .line .cn{color:var(--sub);font-size:14px}
  .tip{color:var(--warn);background:#fbf6ec;border:1px solid #f0e4c8;border-radius:10px;padding:8px 14px;font-size:13.5px;margin:4px 0 12px}
  .tip b{color:var(--warn)}
  /* vocab */
  .word{display:flex;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);align-items:baseline}
  .word:last-child{border-bottom:none}
  .word .w{font-weight:700;font-size:15.5px;min-width:150px}
  .word .ipa{color:var(--accent);font-size:13px}
  .word .pos{color:var(--sub);font-size:12.5px;min-width:36px}
  .word .mean{font-size:14.5px}
  .word .note{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
  /* reading */
  .reading{font-size:15.5px;line-height:2;background:#f7f4ef;border-radius:12px;padding:18px 20px;margin:8px 0 12px}
  .reading b{color:var(--accent)}
  .gist{font-size:14px;color:var(--sub);background:var(--accent-soft);border-radius:10px;padding:10px 14px}
  /* icon cards */
  .tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tip-card{background:#f7f4ef;border-radius:12px;padding:14px 16px}
  .tip-card .ic{font-size:20px}
  .tip-card b{display:block;margin:4px 0 2px;font-size:14.5px}
  .tip-card p{font-size:13.5px;color:var(--sub)}
  /* formula */
  .formula{background:var(--dark);color:#ece7df;border-radius:12px;padding:14px 18px;font-family:Consolas,Menlo,monospace;font-size:14.5px;margin:10px 0;text-align:center}
  .formula b{color:#f0a583}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 13px;font-size:13px;font-weight:600}
  /* examples */
  .ex{border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:12px}
  .ex .en{font-weight:600;font-size:15px}
  .ex .cn{color:var(--sub);font-size:13.5px}
  /* expressions */
  .expr{display:flex;gap:14px;padding:10px 4px;border-bottom:1px dashed var(--line);align-items:baseline}
  .expr:last-child{border-bottom:none}
  .expr .p{font-weight:700;min-width:170px;font-size:15px}
  .expr .d{font-size:13.5px;color:var(--sub)}
  /* conversation */
  .turn{display:flex;gap:12px;margin-bottom:12px}
  .turn .who{width:64px;flex-shrink:0;font-weight:700;font-size:13px;color:var(--accent);padding-top:2px}
  .turn .bubble{background:#f7f4ef;border-radius:12px;padding:10px 16px;flex:1}
  .turn .bubble .en{font-weight:600}
  .turn .bubble .cn{color:var(--sub);font-size:13.5px}
  .turn .note{display:block;font-size:12.5px;color:var(--accent);margin-top:4px}
  /* tasks */
  .task{display:flex;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
  .task:last-child{border-bottom:none}
  .task .ic{font-size:19px}
  .task b{display:block;font-size:14.5px}
  .task p{font-size:13.5px;color:var(--sub)}
  .quiz-group{font-weight:700;color:var(--accent);margin:16px 0 6px;font-size:15px}
  .quiz{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;background:#fbfaf8}
  .quiz .q{font-size:15px;font-weight:600;margin-bottom:6px}
  .quiz .hint{font-size:12.5px;color:var(--sub);margin-bottom:6px}
  .quiz details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600;list-style:none}
  .quiz details summary::before{content:"👀 查看参考答案"}
  .quiz details[open] summary::before{content:"🙈 收起答案"}
  .quiz .a{margin-top:8px;background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:14.5px}
  .quiz .a .cn{color:var(--sub);font-size:13px}
  .quiz .a .tip{margin:6px 0 0;font-size:12.5px}
  .footer{color:var(--sub)};font-size:12.5px;text-align:center;padding:26px 0}
  .menu-btn{display:none}
  .overlay{display:none}
  @media (max-width:860px){
    .sidebar{position:fixed;width:264px;height:100%;transform:translateX(-105%);transition:transform .25s ease;z-index:60;box-shadow:4px 0 18px rgba(0,0,0,.25)}
    .sidebar.open{transform:translateX(0)}
    .menu-btn{display:flex;position:fixed;top:12px;left:12px;z-index:70;width:42px;height:42px;border:none;border-radius:11px;background:var(--dark);color:#fff;font-size:20px;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
    .overlay{display:block;position:fixed;inset:0;background:rgba(20,17,13,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
    .overlay.show{opacity:1;pointer-events:auto}
    .main{margin-left:0;padding:66px 14px 20px;max-width:100%}
    .card{padding:18px 16px;margin-bottom:14px;border-radius:14px}
    .card h3{font-size:16px}
    .hero{padding:14px 0 6px}
    .hero .book{font-size:32px}
    .hero h1{font-size:23px}
    .hero p{font-size:14px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 26px}
    .stat{padding:12px 6px;min-width:0;text-align:center}
    .stat b{font-size:19px}
    .stat div{font-size:11.5px}
    h2.page-title{font-size:20px}
    .lesson-kicker{font-size:12px}
    .meta{gap:6px;margin:10px 0 18px}
    .meta span{font-size:12px;padding:3px 10px}
    .summary{font-size:13px;margin:4px 0 20px}
    .tips-grid{grid-template-columns:1fr}
    .word{flex-wrap:wrap;gap:4px 10px}
    .word .w{min-width:0}
    .word .mean{font-size:14px}
    .reading{font-size:14.5px;padding:14px;line-height:1.95}
    .turn .who{width:46px;font-size:12px}
    .turn .bubble{padding:9px 12px}
    .turn .bubble .en{font-size:14.5px}
    .expr{flex-direction:column;gap:2px}
    .expr .p{min-width:0}
    .formula{font-size:12.5px;padding:12px 14px;text-align:left}
    .chip{font-size:12px;padding:4px 11px}
    .ex .en{font-size:14.5px}
    .quiz .q{font-size:14.5px}
    .quiz .a{font-size:14px}
    .lesson-link{padding:12px}
    .task b{font-size:14px}
    .line .en{font-size:14.5px}
    .footer{padding-bottom:44px}
    .lesson-link.active{font-weight:600}
  }
</style>
<base target="_blank">
</head>
<body>
<button class="menu-btn" id="menuBtn" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Shirley <span>英语口语</span></div>
    <div class="tagline">课堂复习站 · Mike 1v1</div>
    <div class="nav-title">课程列表</div>
    <nav id="lessonNav"></nav>
  </aside>
  <main class="main" id="content"></main>
</div>

<script>
/* ================================================================
   📒 课程笔记数据区
   新增一节课：复制 LESSONS 中的一整段 { id, title, ... }，
   粘贴到数组末尾（注意前面加逗号），页面和导航自动生成。
   支持的模块类型：dialog / vocab / reading / tips / grammar /
   examples / exprs / convo / tasks
   ================================================================ */
const LESSONS = [
  {
    id: 1,
    label: "试听课",
    title: "试听课 · Free Talk 摸底 + 疑问句入门 + 朗读训练",
    date: "2026-10-10",
    teacher: "Mike 老师",
    student: "Shirley",
    summary: "自我介绍摸底 · Sabrina Carpenter 美妆视频朗读 · 特殊疑问句/一般疑问句 · 外贸引导式沟通理念",
    sections: [
      { type:"h3", text:"🌅 开场输出练习 · Self Introduction" },
      { type:"dialog", lines:[
        { en:"My name is Shirley and I am a foreign trade salesperson.", cn:"我叫 Shirley，是一名外贸业务员。", tip:"✅ 完整的主系表句型，表达准确、不卡壳" },
        { en:"My company sells construction machinery, like tractors and skid steer loaders.", cn:"公司主营工程机械类产品，比如拖拉机和滑移装载机。", tip:"💡 machinery /məˈʃiːnəri/ 机械（总称）；skid steer loader 滑移装载机，专业词汇要记牢" },
        { en:"I just graduated in July. My major is international economics and trade.", cn:"我今年 7 月刚毕业，专业是国际经济与贸易。", tip:"💡 fresh graduate 应届毕业生；major 作名词=专业" },
        { en:"The atmosphere in my team is relaxed. My team leader teaches me a lot.", cn:"团队氛围很轻松，团队长教了我很多东西。", tip:"💡 atmosphere 氛围；relaxed /rɪˈlækst/ 放松的" }
      ]},
      { type:"h3", text:"📚 朗读材料生词（Sabrina Carpenter 美妆教程节选）" },
      { type:"vocab", words:[
        { w:"tutorial", ipa:"/tjuːˈtɔːriəl/", pos:"n.", mean:"教学教程", note:"a 10-minute beauty tutorial 十分钟美妆教程" },
        { w:"makeup", ipa:"/ˈmeɪkʌp/", pos:"n.", mean:"化妆；妆容", note:"do my makeup 化妆" },
        { w:"concealer", ipa:"/kənˈsiːlə(r)/", pos:"n.", mean:"遮瑕膏", note:"LAURA MERCIER ultra longwear concealer 持妆遮瑕" },
        { w:"foundation", ipa:"/faʊnˈdeɪʃn/", pos:"n.", mean:"底妆；粉底", note:"⚠️ 不是 foundation 基础义，美妆语境=粉底" },
        { w:"blend out", ipa:"/blend aʊt/", pos:"phr.", mean:"晕染均匀；混合开", note:"blend out with foundation 用粉底把它晕开" },
        { w:"natural light", ipa:"/ˈnætʃrəl laɪt/", pos:"n.", mean:"自然光", note:"by a big window 在大窗户旁（化妆光线好）" }
      ]},
      { type:"h3", text:"🗣️ 朗读材料（演讲/视频节选 + 大意）" },
      { type:"reading", text:"Hi, it's Sabrina Carpenter and I'm going to take you guys through my 10-minute <b>beauty tutorial</b>. One of my favorite places to do my makeup is by a big window, because there's a lot of <b>natural light</b> and you end up getting a better result. I usually start by putting on <b>concealer</b> — all the places that I feel I need it — and then I blend it out with <b>foundation</b>, because I don't like to use a lot of foundation.",
        gist:"📖 段落大意：Sabrina Carpenter 带大家做十分钟美妆教程。她喜欢在自然光充足的大窗边化妆，这样妆效更好；她习惯先上遮瑕膏，再用粉底晕染开，因为不喜欢厚重的底妆。" },
      { type:"h3", text:"🎵 朗读要点（Mike 提醒）" },
      { type:"tips", cards:[
        { ic:"🔤", t:"单个发音过关", d:"每个单词的发音没有太大问题，这是很好的底子" },
        { ic:"🔗", t:"连读弱读是短板", d:"linking & reduction 较弱，长段落第一次读会很吃力，要专项练" },
        { ic:"⏸️", t:"按意群停顿", d:"不要逐词蹦，3~5 个词一个词块，词块之间停一停" },
        { ic:"📈", t:"节奏有起伏", d:"不要平铺直叙地「读」，要真的像「说话」一样，快慢结合" },
        { ic:"👂", t:"听力反应偏慢", d:"关键词能抓住，但整句细节跟不上——平时英语对话练得太少" },
        { ic:"💧", t:"口语词汇量偏少", d:"想表达时卡壳不是语法问题，是单词储备不够 → 每天打卡补词" }
      ]},
      { type:"h3", text:"❓ 语法一：特殊疑问句（开放式提问）" },
      { type:"grammar", formula:"疑问词 + 助动词 + 主语 + 动词原形？",
        intro:[
          "疑问句分两大类：<b>一般疑问句</b>（yes/no 回答，助动词/be 动词/情态动词提前）和<b>特殊疑问句</b>（开放式提问）。",
          "⭐ 本课核心例句：What's your main business? 你们的主营业务是什么？",
          "造句逻辑：第 1 位放疑问词，第 2 位放助动词，助动词由<b>主语</b>决定——主语是第三人称单数（公司/产品）用 <b>is</b>，主语是 you 用 <b>are</b>。",
          "🚫 易错：What's your main business <b>you</b>? —— 主语位置不能重复 you。"
        ],
        chipsTitle:"疑问词 5W1H",
        chips:["what 什么","who 谁","where 哪里","when 何时","why 为什么","which 哪一个","how 怎样"],
        chips2Title:"助动词",
        chips2:["do / does（实义动词句）","am / is / are（be 动词句）","can / could / will / would / should（情态动词）"] },
      { type:"h3", text:"💼 中译英练习：5W1H 特殊疑问句 × 恒旺机械真实场景（每词 2 句）" },
      { type:"quiz", groups:[
        { name:"❓ WHAT · 什么 / 多少", items:[
          { q:"你们的主营产品是什么？", hint:"main product", a:"What's your main product?",
            tip:"💡 本课核心句型：疑问词 What + is + 主语 your main product（三单用 is）" },
          { q:"这台 HW-10 的最大挖掘深度是多少？", hint:"maximum digging depth · 1600 mm", a:"What is the maximum digging depth of the HW-10?",
            tip:"💡 参数类提问万能句：What is the + 参数名 + of + 型号？（斗容 bucket capacity / 功率 power / 整机重量 operating weight 都能套）" }
        ]},
        { name:"👤 WHO · 谁", items:[
          { q:"你们团队谁负责报价？", hint:"responsible for · quotation", a:"Who is responsible for the quotation in your team?",
            tip:"💡 be responsible for + 名词：负责某事" },
          { q:"如果机器出故障，我应该联系谁？", hint:"break down · contact", a:"If the machine breaks down, who should I contact?",
            tip:"💡 break down 出故障（机器）；contact 联系——售后场景高频" }
        ]},
        { name:"📍 WHERE · 哪里", items:[
          { q:"贵公司位于哪个城市？", hint:"located in · Jining, Shandong", a:"Where is your company located?",
            tip:"💡 be located in + 地点：位于……（公司地址：山东济宁 Jining, Shandong）" },
          { q:"这款迷你挖掘机可以在哪些狭窄空间作业？", hint:"narrow spaces · greenhouse / orchard / elevator", a:"Where can this mini excavator work in narrow spaces?",
            tip:"💡 catalog 原话：elevators, indoors, orchards, and greenhouses——答客户时可以直接报这些场景" }
        ]},
        { name:"📅 WHEN · 什么时候", items:[
          { q:"您预计什么时候下单？", hint:"expect to · place the order", a:"When do you expect to place the order?",
            tip:"💡 expect to do 预计做某事；place the order 下单" },
          { q:"我们什么时候能收到报价单？", hint:"quotation", a:"When can we receive the quotation?",
            tip:"💡 receive 收到——客户催报价时的标准问法" }
        ]},
        { name:"💡 WHY · 为什么", items:[
          { q:"为什么 HW-10 特别适合果园挖沟？", hint:"digging ditches in orchards", a:"Why is the HW-10 especially suitable for digging ditches in orchards?",
            tip:"💡 suitable for + 名词/动名词：适合做……；catalog 原文场景，背下来直接用" },
          { q:"为什么交期对你们这么重要？", hint:"delivery time", a:"Why is the delivery time so important to you?",
            tip:"💡 问到痛点（pain point）客户才会觉得你专业——Mike 课堂重点" }
        ]},
        { name:"🔀 WHICH · 哪一个", items:[
          { q:"HW-10 和 HW-15 之间，您更倾向哪一款？", hint:"between A and B", a:"Which one do you prefer between the HW-10 and the HW-15?",
            tip:"💡 between A and B 在两者之间比较；prefer 更倾向" },
          { q:"这三款型号中，哪一款最适合大棚作业？", hint:"best for · greenhouse", a:"Which of these three models is best for greenhouse work?",
            tip:"💡 which + of 范围：在……之中哪一个" }
        ]},
        { name:"⚙️ HOW · 怎样 / 如何", items:[
          { q:"这台挖掘机如何配合辅具实现一机多用？", hint:"attachments · multiple functions", a:"How does this excavator achieve multiple functions with various attachments?",
            tip:"💡 catalog 原文：with the cooperation of various attachments, it can achieve multiple functions" },
          { q:"你们通常如何评估一个新的供应商？", hint:"evaluate · supplier", a:"How do you evaluate a new supplier?",
            tip:"💡 反问客户了解其采购标准，方便你展示公司优势" }
        ]}
      ]},
      { type:"h3", text:"✅ 语法二：一般疑问句（Yes/No 问句）—— 把助动词 / 情态动词 / be 动词提到句首即可" },
      { type:"examples", list:[

/* ================== 渲染逻辑（无需修改） ================== */
function esc(s){ return s; }

function renderNav(activeId){
  const nav = document.getElementById('lessonNav');
  nav.innerHTML = LESSONS.map(l => `
    <a class="lesson-link ${l.id===activeId?'active':''}" onclick="goLesson(${l.id})">
      <span class="lesson-num">${l.id}</span>
      <span class="lesson-name">${l.label || ('Lesson '+l.id)}</span>
      <span class="lesson-date">${l.date.slice(5).replace('-','/')}</span>
    </a>`).join('');
}

function dialogHTML(lines){
  return lines.map(l=>`
    <div class="line"><div class="en">${l.en}</div><div class="cn">${l.cn||''}</div></div>
    ${l.tip?`<div class="tip">${l.tip}</div>`:''}`).join('');
}

function renderLesson(l){
  let body = '';
  let i = 0;
  while(i < l.sections.length){
    const s = l.sections[i];
    if(s.type==="h3"){
      let inner = '';
      let j = i+1;
      while(j < l.sections.length && l.sections[j].type!=="h3"){
        const b = l.sections[j]; j++;
        if(b.type==="dialog") inner += dialogHTML(b.lines);
        if(b.type==="vocab") inner += b.words.map(w=>`
          <div class="word"><span class="w">${w.w} <span class="ipa">${w.ipa||''}</span></span><span class="pos">${w.pos||''}</span>
          <span class="mean">${w.mean}${w.note?`<span class="note">${w.note}</span>`:''}</span></div>`).join('');
        if(b.type==="reading") inner += `<div class="reading">${b.text}</div><div class="gist">${b.gist}</div>`;
        if(b.type==="tips") inner += `<div class="tips-grid">${b.cards.map(c=>`
          <div class="tip-card"><div class="ic">${c.ic}</div><b>${c.t}</b><p>${c.d}</p></div>`).join('')}</div>`;
        if(b.type==="grammar"){
          inner += `<div class="formula">${b.formula}</div>`;
          inner += `<ul style="padding-left:20px">${b.intro.map(x=>`<li style="margin-bottom:8px;font-size:14.5px">${x}</li>`).join('')}</ul>`;
          if(b.chips){ inner += `<div style="font-size:13px;color:var(--sub);margin-top:10px">${b.chipsTitle}</div><div class="chips">${b.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`; }
          if(b.chips2){ inner += `<div style="font-size:13px;color:var(--sub);margin-top:4px">${b.chips2Title}</div><div class="chips">${b.chips2.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`; }
        }
        if(b.type==="quiz"){
          b.groups.forEach(g=>{
            inner += `<div class="quiz-group">${g.name}</div>`;
            inner += g.items.map(it=>`
              <div class="quiz"><div class="q">📝 ${it.q}</div>
              ${it.hint?`<div class="hint">提示：${it.hint}</div>`:''}
              <details open><summary></summary>
                <div class="a"><div class="en">✅ ${it.a}</div>
                ${it.tip?`<div class="tip">${it.tip}</div>`:''}</div>
              </details></div>`).join('');
          });
        }
        if(b.type==="examples") inner += b.list.map(e=>`
          <div class="ex"><div class="en">${e.en}</div><div class="cn">${e.cn||''}</div>
          ${e.tip?`<div class="tip" style="margin:8px 0 0">${e.tip}</div>`:''}</div>`).join('');
        if(b.type==="exprs") inner += b.list.map(e=>`
          <div class="expr"><span class="p">${e.p}</span><span class="d">${e.d}${e.ex?`　→ ${e.ex}`:''}</span></div>`).join('');
        if(b.type==="convo") inner += b.turns.map(t=>`
          <div class="turn"><div class="who">${t.who}</div>
          <div class="bubble"><div class="en">${t.en}</div><div class="cn">${t.cn||''}</div>
          ${t.note?`<span class="note">${t.note}</span>`:''}</div></div>`).join('');
        if(b.type==="tasks") inner += b.list.map(t=>`
          <div class="task"><div class="ic">${t.ic}</div><div><b>${t.t}</b><p>${t.d}</p></div></div>`).join('');
      }
      body += `<div class="card"><h3>${s.text}</h3>${inner}</div>`;
      i = j;
    } else { i++; }
  }
  document.getElementById('content').innerHTML = `
    <div class="lesson-kicker">${l.label || ('LESSON '+l.id)}</div>
    <h2 class="page-title">${l.title}</h2>
    <div class="meta"><span>📅 ${l.date}</span><span>👨‍🏫 ${l.teacher||'Mike 老师'}</span><span>👤 ${l.student||'Shirley'}</span></div>
    <div class="summary">${l.summary||''}</div>
    ${body}
    <div class="footer">📒 Shirley 英语口语 · 课堂复习站 · 每节课一页 · 持续更新</div>`;
}

function renderHome(){
  const modules = LESSONS.reduce((n,l)=>n+l.sections.filter(s=>s.type==="h3").length,0);
  const words = LESSONS.reduce((n,l)=>n+l.sections.reduce((m,s)=>m+((s.words&&s.words.length)||0),0),0);
  document.getElementById('content').innerHTML = `
    <div class="hero"><div class="book">📒</div>
      <h1>Shirley 英语口语 · 课堂复习站</h1>
      <p>每一节课的重点、单词、句型、对话示范都会整理在这里。上课前翻一翻、作业前看一看，把课堂内容真正变成自己的东西。</p>
    </div>
    <div class="stats">
      <div class="stat"><b>${LESSONS.length}</b><div>已更新课程</div></div>
      <div class="stat"><b>${modules}</b><div>知识模块</div></div>
      <div class="stat"><b>${words}</b><div>工程机械高频词</div></div>
    </div>
    <div class="footer">📒 Shirley 英语口语 · 课堂复习站 · 每节课一页 · 持续更新</div>`;
  renderNav(0);
}

function goLesson(id){
  const l = LESSONS.find(x=>x.id===id) || LESSONS[0];
  renderNav(l.id);
  renderLesson(l);
  if(history.replaceState) history.replaceState(null, '', '#/lesson/'+l.id);
  closeMenu();
  window.scrollTo(0,0);
}

function toggleMenu(){
  const sb = document.querySelector('.sidebar');
  const ov = document.getElementById('overlay');
  const btn = document.getElementById('menuBtn');
  const open = sb.classList.toggle('open');
  ov.classList.toggle('show', open);
  btn.textContent = open ? '✕' : '☰';
}
function closeMenu(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('menuBtn').textContent = '☰';
}

function route(){
  closeMenu();
  const m = location.hash.match(/#\/lesson\/(\d+)/);
  if(m){
    const l = LESSONS.find(x=>x.id==m[1]) || LESSONS[0];
    renderNav(l.id);
    renderLesson(l);
  } else {
    renderHome();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
